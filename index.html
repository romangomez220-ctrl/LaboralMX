<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin" />
    <script>
      // El token opaco de recuperación llega desde Stripe una sola vez. Se
      // conserva en la pestaña y se retira de la barra antes de cargar GA4 o React.
      try {
        const returnUrl = new URL(window.location.href);
        const purchaseId = returnUrl.searchParams.get('report_purchase');
        const recoveryToken = returnUrl.searchParams.get('report_token');
        if (purchaseId && recoveryToken) {
          sessionStorage.setItem(`romanus_report_recovery_${purchaseId}`, recoveryToken);
          returnUrl.searchParams.delete('report_token');
          history.replaceState(history.state, '', returnUrl.pathname + returnUrl.search + returnUrl.hash);
        }
      } catch (_) {
        // La recuperación seguirá mostrando un error seguro si el navegador
        // bloquea sessionStorage; nunca se envía el token a terceros.
      }
    </script>
    <title>ROMANUS — Soluciones integrales para el ámbito jurídico, empresarial y personal</title>
    <meta
      name="description"
      content="ROMANUS es una plataforma de soluciones para el ámbito jurídico, empresarial y personal. Su primer producto, Laboral Suite, calcula finiquito y liquidación conforme a la Ley Federal del Trabajo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ROMANUS" />
    <meta property="og:title" content="ROMANUS — Herramientas jurídicas claras" />
    <meta property="og:description" content="Calculadoras y recursos jurídicos claros para México, con metodología visible y alcance responsable." />
    <meta property="og:url" content="https://www.romanus.mx/" />
    <meta property="og:image" content="https://www.romanus.mx/romanus-social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.romanus.mx/romanus-social.jpg" />
    <link rel="canonical" href="https://www.romanus.mx/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google tag (gtag.js) — Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0XMBSS23D7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view se desactiva aquí porque los page views de esta SPA
      // se registran manualmente en cada cambio de ruta (ver
      // src/components/AnalyticsTracker.tsx), para que también se cuenten
      // las navegaciones internas de React Router, no solo la carga inicial.
      // Agregar ?analytics_debug=1 a cualquier ruta habilita DebugView de
      // GA4 de forma explícita, sin marcar como debug las visitas normales.
      const analyticsDebug = new URLSearchParams(window.location.search).get('analytics_debug') === '1';
      gtag('config', 'G-0XMBSS23D7', {
        send_page_view: false,
        debug_mode: analyticsDebug,
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
